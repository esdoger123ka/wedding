<script>
/* ============================================================
   PENGATURAN — cukup ubah bagian ini
   ============================================================ */
const CONFIG = {
  mempelai: "Bagaskara & Farisa",          // tulisan nama di bingkai
  tanggal:  "26 · 12 · 2026",              // tulisan tanggal di bingkai
  tempat:   "Lawangwangi, Bandung",        // tulisan tempat di bingkai
  // URL Apps Script Photobooth (berakhiran /exec). Kosongkan "" = foto tidak dikirim ke Drive.
  uploadUrl: "https://script.google.com/macros/s/AKfycbwSk1fYIsmaCPmaAZIUwbaN_FxpNGCK2OP4NzIcneG4vFLeyNiBsVo0a19HWlhcOoCr0g/exec",
  undangan: "./",                          // link tombol "Invitation"
  galeri:   "gallery.html",                // link ke galeri foto tamu
  latar: "assets/img/cover.jpg"            // foto latar halaman pembuka
};
</script>

<style>
:root{
  --bg:#0E0D0C; --fg:#F6F2EC; --dim:rgba(246,242,236,.68); --faint:rgba(246,242,236,.28);
  --line:rgba(246,242,236,.32); --panel:#171513;
  --sans:"Inter Tight", system-ui, sans-serif;
  --serif:"Instrument Serif", Georgia, serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:1px solid var(--fg);outline-offset:4px}
[hidden]{display:none!important}
.cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:400}
.dim{color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:12px 22px;border:1px solid var(--fg);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:400;text-decoration:none;transition:background .25s,color .25s}
.btn:hover,.btn:focus-visible{background:var(--fg);color:var(--bg)}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.solid:hover{background:transparent;color:var(--fg)}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{font-size:13px;color:var(--dim);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--faint);padding:8px 4px}
.link:hover{color:var(--fg)}

.view{position:fixed;inset:0;display:none;height:100dvh}
body[data-view="start"] #v-start,
body[data-view="booth"] #v-booth,
body[data-view="result"] #v-result{display:flex}

/* ---------- START ---------- */
#v-start{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom));overflow-y:auto}
#v-start .bgc{position:absolute;inset:0;z-index:-1;background:var(--bg) center/cover no-repeat}
#v-start .bgc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,13,12,.8),rgba(14,13,12,.72) 45%,rgba(14,13,12,.96))}
#v-start h1{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(58px,17vw,104px);line-height:.95;margin:14px 0 16px}
#v-start .lead{max-width:340px;color:var(--dim);font-size:15px;margin-bottom:26px}
.field{width:min(100%,320px);margin-bottom:18px;text-align:left}
.field label{display:block;margin-bottom:6px;color:var(--dim)}
.field input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 0;font-size:17px;border-radius:0}
.field input:focus{outline:0;border-bottom-color:var(--fg)}
.field input::placeholder{color:var(--faint)}
#v-start .btn{width:min(100%,320px)}
#start-alt{margin-top:10px}
#start-msg{max-width:340px;margin-top:14px;font-size:13.5px;color:var(--fg);border:1px solid var(--line);padding:12px 14px;text-align:left}
#start-msg button{display:block;margin-top:8px}
#v-start .back{margin-top:24px}
.gal-link{color:var(--dim)}

/* ---------- BOOTH ---------- */
#v-booth,#v-result{flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;min-height:48px}
.top a{text-decoration:none;color:var(--dim)}
.top a:hover{color:var(--fg)}
#pending,#pending2{color:var(--dim);font-variant-numeric:tabular-nums;text-align:center}
#pending:empty,#pending2:empty{display:none}
.top .top-gal{min-width:74px;text-align:right}
.stagebox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 16px 8px;position:relative}
#frame{position:relative;background:var(--bg);box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden}
#frame video,#frame .ph{position:absolute;object-fit:cover;background:#000}
#frame video.mirror{transform:scaleX(-1)}
#frame .ph{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--dim);background:var(--panel);font-size:13px}
#frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#count{position:absolute;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-style:italic;font-size:clamp(84px,30vw,168px);line-height:1;text-shadow:0 4px 40px rgba(0,0,0,.6);pointer-events:none}
#count.tick{animation:tick .9s ease-out}
@keyframes tick{from{opacity:0;transform:scale(1.35)}25%{opacity:1}to{opacity:.9;transform:scale(1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.95}to{opacity:0}}

.controls{padding:6px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center}
.controls.busy .seg,.controls.busy .side{opacity:.3;pointer-events:none}
#seg-count button{min-height:32px}
.seg{display:flex;gap:4px;width:min(100%,380px)}
#seg-frame{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#seg-frame::-webkit-scrollbar{display:none}
#seg-frame button{flex:0 0 auto;padding:8px 12px}
.seg button{flex:1;min-width:0;min-height:38px;padding:8px 2px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;color:var(--dim);border-bottom:1px solid var(--faint);transition:color .2s,border-color .2s}
.seg button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.seg button:hover{color:var(--fg)}
.shoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:min(100%,380px);margin-top:4px}
.side{justify-self:center;min-width:64px;min-height:44px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:400;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px}
.side:hover{color:var(--fg)}
.side svg{width:22px;height:22px}
#shutter{width:72px;height:72px;border-radius:50%;border:1px solid var(--fg);padding:6px;transition:transform .15s}
#shutter::before{content:"";display:block;width:100%;height:100%;border-radius:50%;background:var(--fg);transition:transform .15s}
#shutter:active::before{transform:scale(.9)}
#shutter[disabled]{opacity:.35;pointer-events:none}
#hint{min-height:18px;font-size:12.5px;color:var(--dim);text-align:center}

/* ---------- RESULT ---------- */
#v-result .stagebox{padding-bottom:4px}
#shot{display:block;max-width:100%;max-height:100%;box-shadow:0 18px 60px rgba(0,0,0,.55);-webkit-touch-callout:default;user-select:auto}
.result-ui{padding:8px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}
.msgf{display:block;width:min(100%,380px)}
.msgf input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 0;font-size:16px;border-radius:0}
.msgf input:focus{outline:0;border-bottom-color:var(--fg)}
.msgf input::placeholder{color:var(--faint)}
.msgf input:disabled{opacity:.55}
.post{width:min(100%,380px)}
.post:disabled{cursor:default}
.post.busy{opacity:.7}
.post.done,.post.done:hover{background:transparent;color:var(--fg);border-color:var(--line);opacity:1}
#status a{color:var(--fg);text-underline-offset:3px}
#status:empty{display:none}
#status{font-size:12.5px;color:var(--dim);text-align:center;width:min(100%,380px)}
.acts{display:flex;gap:8px;width:min(100%,380px)}
.acts .btn{flex:1;padding-left:10px;padding-right:10px}

@media (min-width:760px){
  .controls,.result-ui{padding-bottom:22px}
}
@media (max-height:620px){
  #v-start h1{font-size:54px}
  .seg button{min-height:34px}
  #shutter{width:60px;height:60px}
}
@media (prefers-reduced-motion:reduce){
  #count.tick,#flash.go{animation-duration:.01s}
}
</style>
</head>
<body data-view="start">

<!-- ================= START ================= -->
<section class="view" id="v-start" aria-labelledby="t-start">
  <div class="bgc" id="start-bg"></div>
  <p class="cap dim" id="start-eyebrow"></p>
  <h1 id="t-start">Photobooth</h1>
  <p class="lead">Take a photo with our wedding frame, keep it, and leave us a copy.</p>
  <div class="field">
    <label class="cap" for="guest">Your name <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
    <input id="guest" type="text" maxlength="40" autocomplete="name" placeholder="So we know who it's from">
  </div>
  <button class="btn solid" id="start-btn">Open camera</button>
  <button class="link" id="start-alt">Use my phone's camera app instead</button>
  <div id="start-msg" role="status" hidden></div>
  <a class="link gal-link" href="gallery.html" style="margin-top:22px">See everyone's photos →</a>
  <a class="link back" id="back-link" href="./" style="margin-top:4px">← Back to the invitation</a>
</section>

<!-- ================= BOOTH ================= -->
<section class="view" id="v-booth" aria-label="Photobooth camera">
  <div class="top">
    <a class="cap" id="back-link2" href="./">← Invitation</a>
    <span class="cap">Photobooth</span>
    <a class="cap gal-link top-gal" href="gallery.html">Gallery →</a>
  </div>
  <div class="stagebox" id="stagebox">
    <div id="frame">
      <video id="video" playsinline muted autoplay></video>
      <div class="ph" id="ph" hidden></div>
      <canvas id="overlay"></canvas>
      <div id="count" aria-live="assertive"></div>
      <div id="flash"></div>
    </div>
  </div>
  <div class="controls" id="controls">
    <div class="seg" id="seg-frame" role="group" aria-label="Frame"></div>
    <div class="seg" id="seg-filter" role="group" aria-label="Filter"></div>
    <div class="seg" id="seg-count" role="group" aria-label="Number of photos"><button type="button" data-n="strip" aria-pressed="true"></button><button type="button" data-n="1" aria-pressed="false">1 photo</button></div>
    <div class="shoot">
      <button class="side" id="flip" aria-label="Switch camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 9a8 8 0 0 1 14.5-3M20 15a8 8 0 0 1-14.5 3"/><path d="M19 2v4.5h-4.5M5 22v-4.5h4.5"/></svg>
      </button>
      <button id="shutter" aria-label="Take photo"></button>
      <button class="side" id="timer" aria-label="Countdown timer">3s</button>
    </div>
    <p id="hint" aria-live="polite"></p>
    <p class="cap" id="pending" aria-live="polite"></p>
  </div>
  <input type="file" id="file" accept="image/*" capture="user" hidden>
</section>

<!-- ================= RESULT ================= -->
<section class="view" id="v-result" aria-label="Your photo">
  <div class="top">
    <a class="cap" id="back-link3" href="./">← Invitation</a>
    <span class="cap">Your photo</span>
    <a class="cap gal-link top-gal" href="gallery.html">Gallery →</a>
  </div>
  <div class="stagebox"><img id="shot" alt="Your photobooth picture"></div>
  <div class="result-ui">
    <label class="msgf" id="msg-row"><span class="cap dim">A few words for the couple <span style="text-transform:none;letter-spacing:0">(optional)</span></span><input id="pesan" type="text" maxlength="120" autocomplete="off" enterkeyhint="done" placeholder="Shown with your photo in the gallery"></label>
    <button class="btn solid post" id="post">Post to gallery</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="cap" id="pending2" aria-live="polite"></p>
    <div class="acts">
      <button class="btn" id="save">Save to phone</button>
      <button class="btn" id="share" hidden>Share</button>
      <button class="btn" id="again">Retake</button>
    </div>
    <p class="dim" style="font-size:12px;text-align:center">Tip: press and hold the photo to save it to your phone. <a class="gal-link" href="gallery.html">See everyone's photos →</a></p>
  </div>
</section>

(() => {
"use strict";
const $ = s => document.querySelector(s);
const C = CONFIG;
const BG = "#0E0D0C", FG = "#F6F2EC", PANEL = "#171513";
const SERIF = '"Instrument Serif", Georgia, serif';
const SANS  = '"Inter Tight", system-ui, sans-serif';
const fg = a => `rgba(246,242,236,${a})`;
const bg = a => `rgba(14,13,12,${a})`;

/* ============================================================
   BINGKAI — semua ukuran dalam piksel hasil akhir (lebar 1080)
   ============================================================ */
function tracked(ctx, text, x, y, size, track, align = "center", weight = 400) {
  ctx.font = `${weight} ${size}px ${SANS}`;
  const chars = [...String(text).toUpperCase()], sp = size * track;
  const w = chars.map(c => ctx.measureText(c).width);
  const total = w.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
  let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += w[i] + sp; });
  return total;
}
function trackedWidth(ctx, text, size, track, weight = 400) {
  ctx.font = `${weight} ${size}px ${SANS}`;
  const chars = [...String(text).toUpperCase()];
  return chars.reduce((a, c) => a + ctx.measureText(c).width, 0) + size * track * (chars.length - 1);
}
function serif(ctx, text, x, y, size, maxW) {
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  do { ctx.font = `italic 400 ${size}px ${SERIF}`; size -= 2; } while (maxW && ctx.measureText(text).width > maxW && size > 20);
  ctx.fillText(text, x, y);
}

const FLW = {};
["alstroemeria", "lily", "orchid", "hibiscus", "lotus"].forEach(n => {
  const im = new Image(); im.decoding = "async";
  im.onload = () => { if (document.body.dataset.view === "booth") paint(); };
  im.src = FLOWER_DATA[n]; FLW[n] = im;
});
// gambar bunga: x,y = pojok kiri atas sebelum diputar (seperti CSS), w = lebar, rot = derajat
function flower(ctx, n, x, y, w, rot = 0, h) {
  const im = FLW[n]; if (!im || !im.complete || !im.naturalWidth) return;
  if (!w) w = h * im.naturalWidth / im.naturalHeight;
  h = h || w * im.naturalHeight / im.naturalWidth;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot * Math.PI / 180);
  ctx.shadowColor = "rgba(40,60,20,.2)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
}
function shadowRect(ctx, x, y, w, h, fill, blur = 36, off = 16, col = "rgba(0,0,0,.18)") {
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = blur; ctx.shadowOffsetY = off; ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); ctx.restore();
}
function pattern(ctx, size, draw) {
  const c = document.createElement("canvas"); c.width = c.height = size; draw(c.getContext("2d"), size);
  return ctx.createPattern(c, "repeat");
}
const date = () => C.tanggal;
// strip 3 foto: kotak 560x1640 di tengah kanvas 1080x1920
// strip besar: hampir memenuhi layar story 1080x1920
const SX = 100, SY = 60, SW = 880, SH = 1800, PAD = 50, PW = SW - 2 * PAD, PH = 522;
const stripSlots = [0, 1, 2].map(i => ({ x: SX + PAD, y: SY + PAD + i * (PH + 16), w: PW, h: PH }));
function stripLabel(ctx, band, name, sub) {
  ctx.fillStyle = band; ctx.fillRect(SX + PAD, SY + SH - 142, PW, 112);
  ctx.fillStyle = name; serif(ctx, C.mempelai, 540, SY + SH - 78, 60, PW - 60);
  ctx.fillStyle = sub; tracked(ctx, date(), 540, SY + SH - 44, 16, .28);
}
function star(ctx, cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}

// versi 1 foto: kartu 1080x1350 dengan motif bingkai yang sama sebagai pinggiran
const ONE = { x: 90, y: 90, w: 900, h: 1010 };
function singleLabel(ctx, band, name, sub) {
  ctx.fillStyle = band; ctx.fillRect(90, 1128, 900, 132);
  ctx.fillStyle = name; serif(ctx, C.mempelai, 540, 1200, 62, 820);
  ctx.fillStyle = sub; tracked(ctx, date(), 540, 1238, 16, .28);
}
function fillPattern(ctx, size, off, draw, x, y, w, h) {
  ctx.save(); ctx.translate(x + off, y + off); ctx.fillStyle = pattern(ctx, size, draw); ctx.fillRect(-off, -off, w, h); ctx.restore();
}
const dot = (x) => { x.fillStyle = "#F4A3B4"; x.beginPath(); x.arc(23, 23, 8, 0, 7); x.fill(); };
const starTile = (x) => { x.fillStyle = "#F4A3B4"; star(x, 35, 35, 21); };
const STRIPES = [["#C9772F", 22], ["#F2C46D", 18], ["#E98A8A", 16], ["#7D7A35", 20], ["#F4E2C4", 16], ["#B5532C", 16]];
function stripes(ctx, x0, y0, w, h) {
  for (let x = 0; x < w;) for (const [c, sw] of STRIPES) { if (x >= w) break; ctx.fillStyle = c; ctx.fillRect(x0 + x, y0, Math.min(sw, w - x), h); x += sw; }
}
const RED = "#D7261E";
// teks berulang menyamping (bingkai Red), dibaca dari bawah ke atas
function sideText(ctx, cx, y0, h, half = 38) {
  const unit = 300, [a, b] = C.mempelai.split(/\s*&\s*/), mono = `${(a || "B")[0]}&${(b || "F")[0]}.`;
  ctx.save(); ctx.beginPath(); ctx.rect(cx - half, y0, half * 2, h); ctx.clip();
  ctx.translate(cx, y0 + h); ctx.rotate(-Math.PI / 2);
  for (let x = 10; x < h; x += unit) {
    ctx.fillStyle = "#151515"; ctx.textBaseline = "middle"; ctx.textAlign = "left";
    ctx.font = `500 54px ${SANS}`; ctx.fillText(mono, x, 4);
    const w = ctx.measureText(mono).width;
    ctx.font = `italic 400 17px ${SERIF}`; ctx.fillStyle = "#2A0A06";
    ctx.fillText(C.mempelai, x + w + 16, -9); ctx.fillText(C.tanggal, x + w + 16, 13);
  }
  ctx.restore();
}

/* ============================================================
   FILTER — daftar operasi yang sama dipakai untuk pratinjau (CSS)
   dan hasil akhir (piksel), supaya yang dilihat = yang didapat
   ============================================================ */
const FILTERS = {
  bw:      { label: "B&W",     ops: [["grayscale", 1], ["contrast", 1.08], ["brightness", 1.03]], grain: 10 },
  sepia:   { label: "Sepia",   ops: [["grayscale", 1], ["sepia", .55], ["contrast", 1.05]], grain: 8 },
  natural: { label: "Color",   ops: [["saturate", 1.05], ["contrast", 1.03]], grain: 0 }

  if (n === "contrast") { const o = 127.5 * (1 - v); return [v, 0, 0, o, 0, v, 0, o, 0, 0, v, o]; }
  if (n === "brightness") return [v, 0, 0, 0, 0, v, 0, 0, 0, 0, v, 0];
  if (n === "hue-rotate") {

    return [.213 + c * .787 - s * .213, .715 - c * .715 - s * .715, .072 - c * .072 + s * .928, 0,
            .213 - c * .213 + s * .143, .715 + c * .285 + s * .140, .072 - c * .072 - s * .283, 0,
            .213 - c * .213 - s * .787, .715 - c * .715 + s * .715, .072 + c * .928 + s * .072, 0];

function compose(ops) {

  for (const op of ops) {

/* ============================================================
   PRATINJAU
   ============================================================ */
function drawFrame(ctx, scale, shots, hole) {

  f.slots.forEach((s, i) => {

    else if (i === hole) { ctx.clearRect(s.x, s.y, s.w, s.h); vignette(ctx, s, flt.vignette); }
    else { ctx.fillStyle = f.empty || PANEL; ctx.fillRect(s.x, s.y, s.w, s.h); }
  });

  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function layout() {
  const f = F(), r = el.box.getBoundingClientRect();
  const aw = r.width - 32, ah = r.height - 12;
  if (aw <= 0 || ah <= 0) return;
  const k = Math.min(aw / f.w, ah / f.h), w = Math.floor(f.w * k), h = Math.floor(f.h * k);
  el.frame.style.width = w + "px"; el.frame.style.height = h + "px";
  const dpr = Math.min(window.devicePixelRatio || 1, 3), cw = Math.min(f.w, Math.round(w * dpr));

}

  const f = F(), i = Math.min(S.shots.length, f.slots.length - 1), s = f.slots[i];
  const live = S.shots.length < f.slots.length;
  drawFrame(el.overlay.getContext("2d"), el.overlay.width / f.w, S.shots, live ? i : -1);
  const pos = n => { n.style.left = s.x / f.w * 100 + "%"; n.style.top = s.y / f.h * 100 + "%"; n.style.width = s.w / f.w * 100 + "%"; n.style.height = s.h / f.h * 100 + "%"; };
  [el.video, el.ph, el.count].forEach(pos);
  el.video.hidden = S.mode !== "live"; el.ph.hidden = S.mode !== "file";
  el.video.classList.toggle("mirror", S.mirror);
  el.video.style.filter = cssFilter(FILTERS[S.filter]);

    const n = f.slots.length;

  }

}
function segment(root, items, key) {

  Object.entries(items).forEach(([id, it]) => {

/* ============================================================
   KAMERA
   ============================================================ */
function stopCam() { if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; } }
async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("unsupported"), { name: "Unsupported" });
  stopCam();
  S.stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: S.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
  });
  el.video.srcObject = S.stream;
  await new Promise(r => el.video.readyState >= 2 ? r() : el.video.addEventListener("loadeddata", r, { once: true }));
  await el.video.play().catch(() => {});
  const set = S.stream.getVideoTracks()[0].getSettings ? S.stream.getVideoTracks()[0].getSettings() : {};
  S.mirror = set.facingMode !== "environment";
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    $("#flip").style.visibility = cams.length > 1 ? "visible" : "hidden";
  } catch (e) {}
  try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {}

function grab(src, slot, mirror) {
  const c = document.createElement("canvas"); c.width = slot.w; c.height = slot.h;
  const x = c.getContext("2d", { willReadFrequently: true });
  const sw = src.videoWidth || src.naturalWidth, sh = src.videoHeight || src.naturalHeight;
  const k = Math.max(slot.w / sw, slot.h / sh), dw = sw * k, dh = sh * k;
  if (mirror) { x.translate(slot.w, 0); x.scale(-1, 1); }
  x.drawImage(src, (slot.w - dw) / 2, (slot.h - dh) / 2, dw, dh);
  applyFilter(c, FILTERS[S.filter]);
  vignette(x, { x: 0, y: 0, w: slot.w, h: slot.h }, FILTERS[S.filter].vignette);
  return c;
}
async function countdown(n) {
  for (let i = n; i > 0; i--) {
    el.count.textContent = i; el.count.classList.remove("tick"); void el.count.offsetWidth; el.count.classList.add("tick");
    await sleep(1000);
  }
  el.count.textContent = "";
}
function flash() { el.flash.classList.remove("go"); void el.flash.offsetWidth; el.flash.classList.add("go"); }
function setBusy(b) { S.busy = b; el.controls.classList.toggle("busy", b); el.shutter.disabled = b; paint(); }

async function shootLive() {
  if (S.busy || !S.stream) return;
  setBusy(true);
  const f = F();
  try {
    S.shots = []; paint();
    for (let i = 0; i < f.slots.length; i++) {
      await countdown(i === 0 ? S.timer : Math.min(S.timer, 3));
      S.shots.push(grab(el.video, f.slots[i], S.mirror));
      flash(); paint();
      if (i < f.slots.length - 1) await sleep(700);
    }
    await sleep(350);
    await finish();
  } finally { setBusy(false); }
}
function loadImage(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 4000); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("That file couldn't be read as a photo.")); };
    im.src = u;
  });
}
async function onFile() {
  const file = el.file.files && el.file.files[0];
  el.file.value = "";
  if (!file) return;
  setBusy(true);
  try {
    const f = F(), im = await loadImage(file);
    if (S.shots.length >= f.slots.length) S.shots = [];
    S.shots.push(grab(im, f.slots[S.shots.length], false));
    paint();
    if (S.shots.length === f.slots.length) { await sleep(300); await finish(); }
  } catch (e) { el.hint.textContent = e.message; }
  finally { setBusy(false); }
}

/* ============================================================

   ============================================================ */
async function finish() {
  const f = F(), c = document.createElement("canvas");

  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", .88));
  if (!blob) { el.hint.textContent = "Sorry, the photo couldn't be created on this device."; S.shots = []; paint(); return; }
  if (S.url) URL.revokeObjectURL(S.url);
  if (S.queued) $("#pesan").value = "";
  $("#pesan").disabled = false;
  S.blob = blob; S.url = URL.createObjectURL(blob); S.queued = false;
  S.id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12));
  el.shot.src = S.url;

/* status tombol Post to gallery — supaya tamu tahu foto & ucapannya sudah masuk atau belum */
function postState(st) {

$("#save").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = S.url; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
});
$("#share").addEventListener("click", async () => {
  const file = makeFile();
  try { await navigator.share({ files: [file], title: `${C.mempelai} · Photobooth` }); } catch (e) {}
});
el.post.addEventListener("click", postIt);
$("#again").addEventListener("click", () => { S.shots = []; view("booth"); paint(); });

/* ============================================================
   KIRIM KE DRIVE — antre, simpan di HP, kirim ulang otomatis
   ============================================================ */
const Q = (() => {
  let db = null, mem = [];
  const open = () => new Promise(res => {
    try {
      const rq = indexedDB.open("bf-photobooth", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("q", { keyPath: "id" });
      rq.onsuccess = () => { db = rq.result; res(); };
      rq.onerror = rq.onblocked = () => res();
    } catch (e) { res(); }
  });
  const tx = (mode, fn) => new Promise(res => {
    try { const t = db.transaction("q", mode), rq = fn(t.objectStore("q")); t.oncomplete = () => res(rq && rq.result); t.onerror = t.onabort = () => res(null); }
    catch (e) { res(null); }
  });
  return {
    ready: open(),
    async all() { await this.ready; return db ? (await tx("readonly", s => s.getAll())) || [] : mem.slice(); },
    async put(it) { await this.ready; if (db) await tx("readwrite", s => s.put(it)); else mem.push(it); },
    async del(id) { await this.ready; if (db) await tx("readwrite", s => s.delete(id)); else mem = mem.filter(x => x.id !== id); }
  };
})();
let pumping = false, corsOK = false, retryT = 0;
async function badge() {
  const n = (await Q.all()).length, t = n ? `↑ ${n} to send` : "";
  $("#pending").textContent = t; $("#pending2").textContent = t;
  return n;
}
async function enqueue(it) {
  const all = await Q.all();
  if (all.length >= 30) await Q.del(all.sort((a, b) => a.ts - b.ts)[0].id);
  await Q.put(it);
  pump();
}
async function post(it) { // "ok" | "drop" | "retry"
  const body = JSON.stringify(it);
  try {
    const r = await fetch(C.uploadUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body });
    const j = await r.json();
    corsOK = true;
    if (j && j.ok) return "ok";
    return j && j.retry ? "retry" : "drop";
  } catch (e) {
    if (navigator.onLine === false || corsOK) return "retry";
    try { await fetch(C.uploadUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body }); return "ok"; }
    catch (e2) { return "retry"; }
  }
}
async function pump() {
  if (pumping || !C.uploadUrl) return;
  pumping = true; clearTimeout(retryT);
  try {
    for (const it of (await Q.all()).sort((a, b) => a.ts - b.ts)) {
      await badge();
      const r = await post(it);
      const mine = it.id === S.id;
      if (r === "ok") { await Q.del(it.id); if (mine) postState("done"); }
      else if (r === "drop") { await Q.del(it.id); if (mine) postState("failed"); }
      else {
        if (mine) postState("waiting");
        retryT = setTimeout(pump, 20000);
        break;
      }
    }
  } finally { pumping = false; badge(); }
}
window.addEventListener("online", pump);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pump(); });

/* ============================================================
   MULAI
   ============================================================ */
function explain(err) {
  const n = err && err.name;
  if (n === "NotAllowedError" || n === "SecurityError") return "The camera was blocked. Allow camera access for this page in your browser settings and try again, or use your phone's camera app.";
  if (n === "NotFoundError" || n === "OverconstrainedError") return "No camera was found on this device. You can still use your phone's camera app.";
  if (n === "NotReadableError") return "Another app is using the camera. Close it and try again, or use your phone's camera app.";
  return "This browser can't open the camera here. Open this page in Chrome or Safari, or use your phone's camera app.";
}
function say(text, withCopy) {
  el.msg.hidden = false; el.msg.textContent = text;
  if (withCopy && navigator.clipboard) {
    const b = document.createElement("button"); b.className = "link"; b.textContent = "Copy the page link";
    b.addEventListener("click", async () => { try { await navigator.clipboard.writeText(location.href); b.textContent = "Link copied"; } catch (e) {} });
    el.msg.appendChild(b);
  }
}
function enterBooth(mode) {
  S.mode = mode; S.shots = [];
  $("#flip").style.visibility = mode === "live" ? "visible" : "hidden"; $("#timer").style.visibility = mode === "live" ? "visible" : "hidden";
  try { localStorage.setItem("bf-guest", $("#guest").value.trim()); } catch (e) {}
  view("booth"); layout();
}
$("#start-btn").addEventListener("click", async e => {
  const b = e.currentTarget; b.disabled = true; b.textContent = "Opening camera…";
  try { await startCam(); enterBooth("live"); }
  catch (err) { say(explain(err), true); }
  finally { b.disabled = false; b.textContent = "Open camera"; }
});
$("#start-alt").addEventListener("click", () => { stopCam(); enterBooth("file"); });
el.shutter.addEventListener("click", () => S.mode === "live" ? shootLive() : el.file.click());
el.file.addEventListener("change", onFile);
$("#flip").addEventListener("click", async () => {
  if (S.busy) return;
  S.facing = S.facing === "user" ? "environment" : "user";
  try { await startCam(); paint(); } catch (err) { el.hint.textContent = explain(err); }
});
$("#timer").addEventListener("click", e => {
  if (S.busy) return;
  S.timer = S.timer === 3 ? 5 : S.timer === 5 ? 10 : 3;
  e.currentTarget.textContent = S.timer + "s";
});
window.addEventListener("resize", layout);
if (window.ResizeObserver) new ResizeObserver(layout).observe(el.box);
window.addEventListener("pagehide", stopCam);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && S.mode === "live" && document.body.dataset.view !== "start" && S.stream && S.stream.getVideoTracks().every(t => t.readyState === "ended")) startCam().then(paint).catch(() => {});
});

// isi halaman
$("#start-eyebrow").textContent = `${C.mempelai}  ·  ${C.tanggal}`;
document.querySelectorAll(".gal-link").forEach(a => {
  a.href = C.galeri || "gallery.html";
  if (!C.uploadUrl) { if (a.classList.contains("top-gal")) a.style.visibility = "hidden"; else a.hidden = true; }
});
if (C.latar) $("#start-bg").style.backgroundImage = `url("${C.latar}")`;
["#back-link", "#back-link2", "#back-link3"].forEach(s => $(s).href = C.undangan || "./");
if (!C.uploadUrl) { el.post.hidden = true; $("#msg-row").hidden = true; }
try {
  const to = new URLSearchParams(location.search).get("to");
  $("#guest").value = (to || localStorage.getItem("bf-guest") || "").slice(0, 40);
} catch (e) {}
segment($("#seg-frame"), FRAMES, "frame");
segment($("#seg-filter"), FILTERS, "filter");
function countUI() {
  const f = FRAMES[S.frame], row = $("#seg-count");
  row.hidden = !f.single;
  const [strip, one] = row.children;
  strip.textContent = `${f.slots.length} photos`;
  strip.setAttribute("aria-pressed", String(!S.single)); one.setAttribute("aria-pressed", String(S.single));
}
[...$("#seg-count").children].forEach(b => b.addEventListener("click", () => {
  if (S.busy) return;
  S.single = b.dataset.n === "1"; S.shots = []; countUI(); layout();
}));
countUI();
if (/Instagram|FBAN|FBAV|FB_IAB|TikTok|musical_ly|Line\/|MicroMessenger/i.test(navigator.userAgent))
  say("You're inside an app's built-in browser, where the camera often doesn't work. If it fails, open this page in Chrome or Safari.", true);

// huruf harus siap sebelum bingkai digambar
const fonts = document.fonts && document.fonts.load ? Promise.all([
  document.fonts.load(`italic 400 90px ${SERIF}`, "Bagaskara & Farisa"),
  document.fonts.load(`400 21px ${SANS}`, "THE WEDDING OF N° 0123456789")
]).catch(() => {}) : Promise.resolve();
Promise.race([fonts, sleep(3500)]).then(() => { if (document.body.dataset.view === "booth") paint(); });
window.__fontsReady = fonts;

badge().then(n => { if (n) pump(); });
})();
</script>
